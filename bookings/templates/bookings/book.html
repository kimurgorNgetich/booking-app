<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book an appointment</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-rose-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow p-6">
        <h1 class="text-2xl font-semibold mb-1">Book an appointment</h1>
        <p class="text-gray-500 mb-6">Advance Choice</p>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
                <div>
                    <label class="block text-sm font-medium mb-1" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}<p class="text-red-600 text-sm mt-1">{{ error }}</p>{% endfor %}
                </div>
            {% endfor %}
            <button type="submit" class="w-full bg-rose-600 text-white rounded-lg py-2 font-medium">Book</button>
        </form>
    </div>
</body>
</html>
