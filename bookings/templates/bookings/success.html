<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Booking received</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-rose-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow p-6 text-center">
        <h1 class="text-2xl font-semibold mb-2">Booking received</h1>
        <p>{{ appointment.service.name }} on {{ appointment.start_time|date:"D j M, H:i" }}</p>
        <p class="text-gray-500 mt-2">Status: {{ appointment.get_status_display }}</p>
    </div>
</body>
</html>
